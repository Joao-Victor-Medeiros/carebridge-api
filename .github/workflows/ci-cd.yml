name: CI/CD

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

# Um push novo na mesma branch cancela a execucao anterior, que ja ficou velha.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar e rodar os testes
        run: ./mvnw -B -ntp verify

      - name: Guardar relatorio dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: target/surefire-reports/
          retention-days: 7

  smoke:
    name: Imagem Docker e subida da API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Banco descartavel so para este teste, com as mesmas credenciais do docker-compose.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: carebridge-db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d carebridge-db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir a imagem (mesmo Dockerfile do Render)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: carebridge-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sobe a API com o profile prod. Se uma migration do Flyway nao bater com as
      # entidades (ddl-auto: validate), a aplicacao nem inicia e o job falha aqui,
      # antes de chegar no Render.
      - name: Subir a API
        run: |
          docker run -d --name api --network host \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e PORT=8080 \
            -e DATABASE_URL=jdbc:postgresql://localhost:5432/carebridge-db \
            -e DATABASE_USERNAME=admin \
            -e DATABASE_PASSWORD=admin \
            -e JWT_SECRET=segredo-apenas-para-o-ci \
            -e FLYWAY_BASELINE_ON_MIGRATE=true \
            carebridge-api:ci

      - name: Esperar o health check responder UP
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "API no ar depois de $((i * 3))s"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' api)" != "true" ]; then
              echo "::error::O container parou durante a inicializacao"
              exit 1
            fi
            sleep 3
          done
          echo "::error::A API nao respondeu em 90s"
          exit 1

      - name: Conferir o Swagger
        run: curl -fsS http://localhost:8080/v3/api-docs > /dev/null

      - name: Logs da API
        if: always()
        run: docker logs api

  deploy:
    name: Deploy no Render
    needs: [test, smoke]
    # So publica o que chegou na master por push (merge de PR), nunca a partir de PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.RENDER_URL }}
    # Nunca dois deploys ao mesmo tempo; o segundo espera o primeiro terminar.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Disparar o deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Configure o secret RENDER_DEPLOY_HOOK_URL (veja a secao CI/CD do README)"
            exit 1
          fi
          curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null
          echo "Deploy solicitado ao Render"

      # O Render leva alguns minutos para construir a imagem, e o plano gratuito
      # ainda demora para acordar. Aqui so confirmamos que a API voltou a responder.
      - name: Conferir a API publicada
        if: vars.RENDER_URL != ''
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          sleep 60
          for i in $(seq 1 40); do
            if curl -fsS --max-time 20 "$RENDER_URL/actuator/health" | grep -q '"status":"UP"'; then
              echo "API publicada respondendo em $RENDER_URL"
              exit 0
            fi
            sleep 15
          done
          echo "::error::A API publicada nao respondeu UP em 11 minutos. Confira os logs no painel do Render."
          exit 1
