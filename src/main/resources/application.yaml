spring:
  application:
    name: carebridge-api

  config:
    import: "optional:file:./.env[.properties]"

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:22MB}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/carebridge-db}
    username: ${DATABASE_USERNAME:admin}
    password: ${DATABASE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1

api:
  security:
    token:
      secret: ${JWT_SECRET}