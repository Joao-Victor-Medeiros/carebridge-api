server:
  address: 0.0.0.0
  port: ${PORT:8080}
  forward-headers-strategy: native

spring:
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:22MB}
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

api:
  security:
    token:
      secret: ${JWT_SECRET}

app:
  # Em produção, o código deve ser aleatório e enviado por e-mail.
  # Para testes excepcionais, ainda é possível definir CODIGO_FIXO no Render.
  codigo-fixo: ${CODIGO_FIXO:}
  brevo:
    enabled: ${BREVO_ENABLED:true}

management:
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true